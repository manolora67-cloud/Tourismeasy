<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planes Turísticos - TourismEasy</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/planes_turisticos.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/captcha.css">
    <link rel="stylesheet" href="../css/agente-ia.css" />
    <link rel="icon" type="image/png" href="../img/TURISMEASY.png">
</head>

<body>
    <!-- NAVBAR: se rellena solo con componentes/navbar.js -->
    <div id="site-navbar" data-context="subpage" data-active="planes"></div>

    <main>
        <section class="module-hero">
            <h1 class="module-title">Planes Turísticos</h1>
            <p class="module-subtitle">Experiencias diseñadas para todos en Santander.</p>
        </section>

        <div class="search-container">
            <div class="search-group">
                <label>Lugar</label>
                <select id="filtro-lugar">
                    <option value="">Todos los destinos</option>
                </select>
            </div>
            <div class="search-group">
                <label>Tipo de Plan</label>
                <select id="filtro-tipo">
                    <option value="">Todos los tipos</option>
                </select>
            </div>
            <div class="search-group">
                <label>Accesibilidad</label>
                <select id="filtro-accesibilidad">
                    <option value="">Todas las opciones publicadas</option>
                </select>
            </div>
            <div class="plan-search-actions">
                <button class="btn-buscar" id="btn-explorar" type="button">Explorar Planes</button>
                <button class="btn-limpiar-planes" id="btn-limpiar-planes" type="button">Limpiar filtros</button>
            </div>
        </div>

        <p class="plan-search-status" id="plan-search-status" role="status" aria-live="polite"></p>
        <div class="results-grid" id="planes-results-grid">
        </div>
        <nav class="plan-pagination" id="plan-pagination" aria-label="Paginación de planes turísticos" hidden>
            <button type="button" id="plan-previous-page" aria-label="Página anterior">Anterior</button>
            <span id="plan-page-summary" aria-live="polite"></span>
            <button type="button" id="plan-next-page" aria-label="Página siguiente">Siguiente</button>
        </nav>
    </main>

    <!-- ================================================
     MODAL DETALLES DE PLAN TURÍSTICO (propio de esta página)
     ================================================ -->
    <div id="plan-detalle-overlay" class="vd-overlay" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="vd-box">
            <button class="vd-cerrar" id="plan-cerrar" aria-label="Cerrar">&times;</button>
            <img class="vd-img" id="plan-img" src="" alt="">
            <div class="vd-body">
                <h2 class="vd-titulo" id="plan-titulo"></h2>
                <div class="vd-info-grid">
                    <div class="vd-info-item">
                        <i class="fa-solid fa-tag"></i>
                        <div>
                            <span class="vd-label">Categoría</span>
                            <span class="vd-val" id="plan-categoria"></span>
                        </div>
                    </div>
                    <div class="vd-info-item">
                        <i class="fa-solid fa-location-dot"></i>
                        <div>
                            <span class="vd-label">Ubicación</span>
                            <span class="vd-val" id="plan-ubicacion"></span>
                        </div>
                    </div>
                    <div class="vd-info-item">
                        <i class="fa-solid fa-clock"></i>
                        <div>
                            <span class="vd-label">Duración</span>
                            <span class="vd-val" id="plan-duracion"></span>
                        </div>
                    </div>
                    <div class="vd-info-item">
                        <i class="fa-solid fa-circle-check"></i>
                        <div>
                            <span class="vd-label">Incluye</span>
                            <span class="vd-val" id="plan-incluye"></span>
                        </div>
                    </div>
                    <div class="vd-info-item vd-info-full">
                        <i class="fa-solid fa-wheelchair"></i>
                        <div>
                            <span class="vd-label">Accesibilidad</span>
                            <span class="vd-val" id="plan-accesibilidad"></span>
                        </div>
                    </div>
                </div>
                <div class="vd-footer">
                    <span class="vd-precio" id="plan-precio"></span>
                    <a class="vd-whatsapp" id="plan-whatsapp" href="#" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-whatsapp"></i> Escribir por WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER: se rellena solo con componentes/footer.js -->
    <div id="site-footer"></div>

    <!-- ==== COMPONENTES GLOBALES (mismo orden que index.html) ==== -->
    <script src="../componentes/navbar.js"></script>
    <script src="../componentes/btn-acceder.js"></script>
    <script src="../componentes/dark-mode-toggle.js"></script>
    <script src="../componentes/footer.js"></script>

    <!-- ==== SCRIPTS PROPIOS DE ESTA PÁGINA ==== -->

    <script src="../js/captcha.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../componentes/agente-ia.js"></script>
    <script src="../js/planes_turisticos.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="../js/santanderianidad.js"></script>
</body>

</html>
