<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Auxiliar - TourismEasy</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/carrito.css">
    <link rel="stylesheet" href="../css/personal_auxiliar.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/captcha.css">
    <link rel="stylesheet" href="../css/agente-ia.css" />
    <link rel="icon" type="image/png" href="../img/TURISMEASY.png">
</head>

<body>
    <!-- NAVBAR: se rellena solo con componentes/navbar.js -->
    <div id="site-navbar" data-context="subpage" data-active="personal"></div>

    <main>
        <section class="module-hero">
            <h1 class="module-title">Personal Auxiliar</h1>
            <p class="module-subtitle">Acompañamiento especializado para tu tranquilidad.</p>
        </section>

        <div class="search-container">
            <div class="search-group">
                <label>Tipo de Apoyo</label>
                <select id="select-tipo-apoyo">
          <option value="">Todos</option>
          <option value="Enfermería">Enfermería</option>
          <option value="Guía de Señas">Guía de Señas</option>
          <option value="Asistente de Movilidad">Asistente de Movilidad</option>
          <option value="Intérprete de Lengua de Señas">Intérprete de Lengua de Señas</option>
          <option value="Asistente Personal">Asistente Personal</option>
        </select>
            </div>
            <button class="btn-buscar" id="btn-buscar-auxiliar">Buscar Auxiliar</button>
        </div>

        <p id="msg-sin-resultados" style="display:none; text-align:center; padding:2rem; color:#888; font-size:1.1rem;">
            No se encontraron auxiliares para el tipo de apoyo seleccionado.
        </p>

        <div class="results-grid" id="results-grid-aux">
        </div>
    </main>

    <!-- ================================================
     MODAL DETALLES DE PERSONAL AUXILIAR (propio de esta página)
     Estilos en personal_auxiliar.css
     ================================================ -->
    <div id="pa-detalle-overlay" class="pa-overlay" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="pa-box">
            <button class="pa-cerrar" id="pa-cerrar" aria-label="Cerrar">&times;</button>
            <img class="pa-img" id="pa-img" src="" alt="">
            <div class="pa-body">
                <h2 class="pa-titulo" id="pa-titulo"></h2>
                <div class="pa-info-grid">
                    <div class="pa-info-item">
                        <i class="fa-solid fa-calendar-check"></i>
                        <div>
                            <span class="pa-label">Disponibilidad</span>
                            <span class="pa-val" id="pa-disponibilidad"></span>
                        </div>
                    </div>
                    <div class="pa-info-item">
                        <i class="fa-solid fa-medal"></i>
                        <div>
                            <span class="pa-label">Experiencia</span>
                            <span class="pa-val" id="pa-experiencia"></span>
                        </div>
                    </div>
                    <div class="pa-info-item pa-info-full">
                        <i class="fa-solid fa-briefcase-medical"></i>
                        <div>
                            <span class="pa-label">Especialidad</span>
                            <span class="pa-val" id="pa-especialidad"></span>
                        </div>
                    </div>
                    <div class="pa-info-item pa-info-full">
                        <i class="fa-solid fa-certificate"></i>
                        <div>
                            <span class="pa-label">Certificaciones</span>
                            <span class="pa-val" id="pa-certificaciones"></span>
                        </div>
                    </div>
                    <div class="pa-info-item pa-info-full">
                        <i class="fa-solid fa-wheelchair"></i>
                        <div>
                            <span class="pa-label">Accesibilidad</span>
                            <span class="pa-val" id="pa-accesibilidad"></span>
                        </div>
                    </div>
                </div>
                <div class="pa-footer">
                    <span class="pa-precio" id="pa-precio"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER: se rellena solo con componentes/footer.js -->
    <div id="site-footer"></div>

    <!-- ==== COMPONENTES GLOBALES (mismo orden que index.html) ==== -->
    <script src="../componentes/navbar.js"></script>
    <script src="../componentes/btn-acceder.js"></script>
    <script src="../componentes/dark-mode-toggle.js"></script>
    <script src="../componentes/footer.js"></script>

    <!-- ==== SCRIPTS PROPIOS DE ESTA PÁGINA ==== -->
    <script src="../js/captcha.js"></script>
    <script src="../componentes/carrito.js"></script>
    <script src="../js/login.js"></script>
    <script src="../componentes/agente-ia.js"></script>
    <script src="../js/personal_auxiliar.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="../js/santanderianidad.js"></script>
</body>

</html>
