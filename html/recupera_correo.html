<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - TourismEasy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/recuperacion.css">
    <link rel="icon" type="image/png" href="../img/TURISMEASY.png">
</head>

<body>

    <div class="rec-card">

        <!-- Cabecera -->
        <div class="rec-header">
            <a class="rec-logo" href="../index.html">
                <img src="../img/TURISMEASY.png" alt="TourismEasy Logo" class="logo-img"> TOURISMEASY
            </a>
            <h1 class="rec-title">Nueva contraseña</h1>
            <p class="rec-subtitle">Elige una contraseña segura de al menos 8 caracteres.</p>
        </div>

        <!-- Formulario -->
        <form class="rec-form" id="formRestablecer" novalidate>
            <div class="field-group">
                <label for="password">Nueva contraseña</label>
                <div class="field-wrap has-toggle">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <div class="pass-strength">
                    <div class="pass-strength-bar" id="bar1"></div>
                    <div class="pass-strength-bar" id="bar2"></div>
                    <div class="pass-strength-bar" id="bar3"></div>
                    <div class="pass-strength-bar" id="bar4"></div>
                </div>
                <span class="pass-strength-label" id="strengthLabel"></span>
            </div>

            <button type="submit" class="btn-rec" id="btnActualizar">
                <span class="btn-text"><i class="fa-solid fa-key"></i> Actualizar contraseña</span>
                <span class="spinner"></span>
            </button>
        </form>

        <!-- Mensaje de resultado -->
        <div class="rec-mensaje" id="mensaje">
            <i class="fa-solid fa-circle-check"></i>
            <span id="mensajeTexto"></span>
        </div>

        <!-- Pie -->
        <div class="rec-footer">
            <a href="login.html" id="linkVolverLogin"><i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión</a>
            <button class="btn-dark-mode" id="darkModeToggle" aria-label="Cambiar tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

    </div>

    <script src="../js/controlador_recuperacion.js"></script>
    <script src="../js/santanderianidad.js"></script>


    <script src="../menu_accesibilidad/menu.js?v=a11y-v16"></script>
</body>

</html>
