<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - TourismEasy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/recuperacion.css">
    <link rel="icon" type="image/png" href="../img/TURISMEASY.png">
</head>

<body>

    <div class="rec-card">

        <!-- Cabecera -->
        <div class="rec-header">
            <a class="rec-logo" href="../index.html">
                <img src="../img/TURISMEASY.png" alt="TourismEasy Logo" class="logo-img"> TOURISMEASY
            </a>
            <h1 class="rec-title">Recuperar contraseña</h1>
            <p class="rec-subtitle">Ingresa tu correo y te enviaremos un enlace seguro para restablecerla.</p>
        </div>

        <!-- Formulario -->
        <form class="rec-form" id="formSolicitud" novalidate>
            <div class="field-group">
                <label for="email">Correo electrónico</label>
                <div class="field-wrap">
                    <i class="fa-solid fa-envelope field-icon"></i>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" autocomplete="email" required>
                </div>
            </div>

            <button type="submit" class="btn-rec" id="btnEnviar">
                <span class="btn-text"><i class="fa-solid fa-paper-plane"></i> Enviar enlace</span>
                <span class="spinner"></span>
            </button>
        </form>

        <!-- Mensaje de resultado -->
        <div class="rec-mensaje" id="mensaje">
            <i class="fa-solid fa-circle-check"></i>
            <span id="mensajeTexto"></span>
        </div>

        <!-- Pie -->
        <div class="rec-footer">
            <a href="login.html" id="linkVolverLogin"><i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión</a>
            <button class="btn-dark-mode" id="darkModeToggle" aria-label="Cambiar tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

    </div>

    <script src="../js/controlador_recuperacion.js"></script>
    <script src="../js/santanderianidad.js"></script>


</body>

</html>
